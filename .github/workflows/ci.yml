name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tag since v8
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: |
          uv python install 3.12
          uv sync --locked --all-groups

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      # Seeded models with the final models' shapes (the int8 CNN and the per-fan GMM): each
      # writes its C headers, reads them back and checks every test vector. Real-model
      # headers need the training audio and stay local.
      - name: Export C headers
        run: |
          uv run python -m andon.export_c --synthetic --out firmware/build/model
          uv run python -m andon.export_gmm --synthetic --out firmware/build/model

  # Cross-compiles the Pico 2 firmware, so a change that breaks the device build fails CI
  # even though the host tests (in the job above) still pass.
  firmware:
    runs-on: ubuntu-latest
    # A normal run takes about 2 minutes. Before the cache, a slow mirror made the toolchain
    # step take 16, 28 and 53 minutes, and once 2 h 24 min; 60 lets the first three finish
    # (a run with no cache still downloads everything) and fails the last instead of
    # hanging. A run that times out is rerun with `gh run rerun <id> --failed`.
    timeout-minutes: 60
    env:
      PICO_SDK_PATH: ${{ github.workspace }}/../pico-sdk
      APT_DEBS: /home/runner/apt-debs
    steps:
      - uses: actions/checkout@v7

      # The toolchain is about 625 MB of .deb files, 487 MB of them
      # libstdc++-arm-none-eabi-newlib, and the slow mirror is where the time goes, so the
      # downloaded files are kept between runs. The key holds the Ubuntu release, so one
      # release's files are never restored on the next.
      - name: Read the Ubuntu release
        id: os
        run: echo "release=$(lsb_release -rs)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ env.APT_DEBS }}
          key: apt-debs-${{ steps.os.outputs.release }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-debs-${{ steps.os.outputs.release }}-

      - name: Install the Arm toolchain
        run: |
          mkdir -p "$APT_DEBS/partial"
          sudo apt-get update
          sudo apt-get install -y -o Dir::Cache::Archives="$APT_DEBS" \
            cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib libusb-1.0-0-dev pkg-config
          # apt writes as root; the cache step saves as the runner user. The size shows the
          # files were kept (about 625 MB when they were all downloaded).
          sudo chown -R "$USER" "$APT_DEBS"
          du -sh "$APT_DEBS"

      # andon_bench needs the model and test-vector headers; synthetic models have the real
      # ones' shapes and need no training data.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Export synthetic model headers
        run: |
          uv python install 3.12
          uv sync --locked
          uv run python -m andon.export_c --synthetic --out firmware/model
          uv run python -m andon.export_gmm --synthetic --out firmware/model

      - name: Fetch the Pico SDK
        run: |
          git clone --depth 1 --branch 2.3.1 https://github.com/raspberrypi/pico-sdk "$PICO_SDK_PATH"
          git -C "$PICO_SDK_PATH" submodule update --init --depth 1 lib/tinyusb

      - name: Build
        run: |
          cmake -S firmware -B firmware/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/build
          arm-none-eabi-size firmware/build/andon.elf firmware/build/andon_bench.elf

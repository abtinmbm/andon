[project]
name = "andon"
version = "0.1.0"
description = "Machine-sound anomaly detection that learns normal from healthy recordings and stops the machine when it sounds wrong."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # <2.5: Windows Smart App Control blocks numpy 2.5's unsigned DLLs until they gain reputation.
    "numpy>=2.0,<2.5",
    "pyyaml>=6.0",
    # Classic detectors (Phase 2); tests also cross-check our AUC and pAUC against it.
    "scikit-learn>=1.9.1",
    "torch>=2.5",
]

[dependency-groups]
# Phase 5: the live andon dashboard and the GIF renderer. Not needed to train or score.
dashboard = [
    "matplotlib>=3.11.2",
    # <26: Windows Smart App Control blocks pyarrow 26's unsigned DLLs (streamlit needs it).
    "pyarrow<26",
    "streamlit>=1.66.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # Reference implementation, used only in tests to cross-check our log-mel.
    "librosa>=0.10.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["andon"]

# CPU-only PyTorch everywhere (laptop, CI). GPU training runs on Colab/Kaggle.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH"]

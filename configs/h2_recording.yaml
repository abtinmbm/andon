# Phase H2: the fixed recording setup for the real-fan dataset. Every session uses exactly
# these settings, so recordings from different days and fans can be pooled. The physical
# setup (mic position, mount, room) is in docs/recording_protocol.md; anything that changes
# here after the first real session (s1) makes the sessions incomparable.
phase: H2

data:
  root: data/realfan        # gitignored; one folder per session, plus manifest.csv

audio:
  sample_rate: 16000        # the DCASE rate; the mic runs in its low-power mode (6.25-18.75 kHz)
  clip_seconds: 10          # one WAV per 10 s, like the DCASE clips (625 frames of 256 samples)
  # Digital gain of 2^gain_shift on the mic's 24-bit samples before int16 (mic_stream.h):
  # 0 keeps the top 16 bits, each step adds 6 dB. Fixed from the pilot on id_00 at gain 0
  # (results/h2_pilot.md): the loudest peak was -39.3 dBFS (obstruction), so 4 (x16, +24 dB)
  # puts it near -15 dBFS and normal running near -39 dBFS, leaving ~15 dB of headroom for
  # louder fans. Checked on id_01 (ANVISION A) at gain 4: obstruction peaks at -9.6 dBFS.
  gain_shift: 4

recording:
  settle_seconds: 5         # after "fan on", before the first sample: spin-up is not normal running
  speed_pct: 100            # the only speed recorded (PM decision, 2026-11-07)
  normal_minutes: 30        # per fan per session
  fault_minutes: 3          # per fault per fan per session

sessions:                   # d1-d3 are all recorded in the dorm room (DECISIONS 2026-11-14)
  dev: [d1, d2]             # train on their normals, tune on their faults (H3)
  eval: [d3]                # the last session; scored once per final model
  other: [pilot, s1]        # recorded at home: the level check, and a session in another room;
                            # never used for training or scoring

fans:                       # machine IDs; the two ANVISION fans are marked A and B on the frame
  id_00: Sunon MF40100V2
  id_01: ANVISION YDM4010B05 (A)
  id_02: ANVISION YDM4010B05 (B)

faults:                     # name: what is done to the fan (all with the fan off first)
  imbalance: a 5 x 5 mm square of electrical tape flat on one blade face near the tip, not over the edge
  obstruction: a 4 x 1.3 cm index-card strip taped flat on the frame over the bottom third of the intake side

retired_faults:             # tried in the pilot only and dropped; never recorded in s1 or d1-d3
  rattle: a corner shimmed off the tape (paper, then a dime, then a nickel); sounded like normal running

# Phase H2: the fixed recording setup for the real-fan dataset. Every session uses exactly
# these settings, so recordings from different days and fans can be pooled. The physical
# setup (mic position, mount, room) is in docs/recording_protocol.md; anything that changes
# here after the first real session (s1) makes the sessions incomparable.
phase: H2

data:
  root: data/realfan        # gitignored; one folder per session, plus manifest.csv

audio:
  sample_rate: 16000        # the DCASE rate; the mic runs in its low-power mode (6.25-18.75 kHz)
  clip_seconds: 10          # one WAV per 10 s, like the DCASE clips (625 frames of 256 samples)
  # Digital gain of 2^gain_shift on the mic's 24-bit samples before int16 (mic_stream.h):
  # 0 keeps the top 16 bits, each step adds 6 dB. Fixed from the pilot on id_00 at gain 0
  # (results/h2_pilot.md): the loudest peak was -39.3 dBFS (obstruction), so 4 (x16, +24 dB)
  # puts it near -15 dBFS and normal running near -39 dBFS, leaving ~15 dB of headroom for
  # louder fans. Checked on id_01 (ANVISION A) at gain 4: obstruction peaks at -9.6 dBFS.
  gain_shift: 4

recording:
  settle_seconds: 5         # after "fan on", before the first sample: spin-up is not normal running
  speed_pct: 100            # normal running (PM decision, 2026-11-07)
  # The underspeed fault: only the PWM duty changes (25 kHz, above hearing and the mic's band).
  # Fixed from the dpilot session on id_01 (DECISIONS 2026-11-16): 85 % is the smallest of
  # 85/70/55 and still changes every band steadily (2-4 kHz: -8.8 dB, -8.9 to -8.6 per clip).
  fault_speed_pct:
    underspeed: 85
  normal_minutes: 30        # per fan per session
  fault_minutes: 3          # per fault per fan per session

sessions:                   # d1-d3 are all recorded in the dorm room (DECISIONS 2026-11-14)
  dev: [d1, d2]             # train on their normals, tune on their faults (H3)
  eval: [d3]                # the last session; scored once per final model
  other: [pilot, s1, dpilot]  # pilot and s1 at home (the level check, a session in another
                            # room), dpilot in the dorm (choosing the underspeed duty);
                            # never used for training or scoring

fans:                       # machine IDs; the two ANVISION fans are marked A and B on the frame
  id_00: Sunon MF40100V2
  id_01: ANVISION YDM4010B05 (A)
  id_02: ANVISION YDM4010B05 (B)

faults:                     # name: what is done to the fan (all with the fan off first)
  underspeed: nothing to change on the fan; the recorder runs it at the underspeed duty
  obstruction: a 4 x 1.3 cm index-card strip taped flat on the frame over the bottom third of the intake side

retired_faults:             # dropped; their clips stay on disk, readable only in these sessions
  rattle:
    how: a corner shimmed off the tape (paper, then a dime, then a nickel)
    why: sounded like normal running
    sessions: [pilot]
  imbalance:
    how: electrical tape on one blade (a 5 x 5 mm square; in d1 also a 12/6 x 6 mm trapezoid)
    why: not repeatable; the square gave no steady change, the trapezoid lifted and buzzed on id_01
    sessions: [pilot, s1, d1]

# Clips no model uses (andon.realfan.usable_rows); the files stay on disk and the dataset
# check still covers them. Fixed before d2, so it is never chosen from results (DECISIONS
# 2026-11-16).
skip_first_clips:           # fault: clips at the start of each of its takes, in every session
  underspeed: 3             # id_00 is still slowing for 20-30 s after the switch to 85 %

repeatability:              # a fault must keep its size from session to session (DECISIONS 2026-11-16)
  reference_session: d1
  tolerance_db: 3           # outside it: in d2 stop and decide; in d3 report as is, never re-tune
  pairs: [[id_00, underspeed]]  # id_00 sits on the knee of its speed curve (90 % doesn't slow it)

excluded_clips:             # single clips left out of every use (file stays on disk): file: why
  d1/normal_id_02_00000003.wav: a knock 9.25-9.34 s into the clip, not the fan

# Phase 3, step 4: phase3_idcnn_mixup (kept in step 3) plus spectrogram masking, the only
# change. Each training patch gets 2 random bands of up to 12 mel bins and 2 random spans
# of up to 6 frames set to the training mean (about 10% of each axis per mask).
phase: 3

data:
  root: data
  machine_types: [ToyCar, ToyConveyor, fan, pump, slider, valve]

features:  # identical to phase1_baseline, so its feature cache is reused
  sample_rate: 16000
  n_fft: 1024
  hop_length: 512
  n_mels: 128
  power: 2.0

model:
  type: id_cnn
  channels: [16, 32, 64, 128]  # stride-2 stem, then 3 pooled stages; about 98k weights
  patch_frames: 64             # about 2 s of audio per patch
  score_hop: 32                # scoring windows overlap by half

train:
  epochs: 100        # one random patch per training clip per epoch; the last epoch is kept
  batch_size: 128
  learning_rate: 0.001  # Adam, cosine decay to 0 over the run
  mixup_alpha: 0.2      # kept from phase3_idcnn_mixup
  spec_mask:            # the one change from phase3_idcnn_mixup
    freq_masks: 2
    freq_width: 12
    time_masks: 2
    time_width: 6

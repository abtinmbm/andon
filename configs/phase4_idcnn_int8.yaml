# Phase 4: the final Phase 3 CNN (phase3_idcnn_mixup), quantized to int8 after training.
# Nothing is retrained: each seed's float checkpoint is loaded, batch norm is folded in,
# weights go to int8 per output channel and activations to int8 per tensor, with ranges
# from the min and max seen on calibration patches (andon/quant.py).
#
# Calibration: one random patch from each of calib_clips random normal training clips of
# the type (the clips the CNN trained on: dev train and additional train), drawn with the
# run seed. No test clip is used.
#
# Expected before the run: a small AUC loss (a few tenths of a point). This is a
# measurement of the quantized final model, not a model choice, so there is no keep rule.
#
# Chosen for the device on dev test (DECISIONS.md, Phase 4): it fits the budget and has
# the highest dev AUC of the models that do. Only then was it marked final, which lets
# andon.quantize score it on eval, once.
phase: 4
final: true

data:
  root: data
  machine_types: [ToyCar, ToyConveyor, fan, pump, slider, valve]

model:
  type: id_cnn_int8
  from_config: configs/phase3_idcnn_mixup.yaml  # checkpoints, features, patch width and hop

quantize:
  calib_clips: 2048

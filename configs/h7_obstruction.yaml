# Phase H7: obstruction trials on the board, all on one calibration (2026-11-22). Each trial
# starts the fan normal and runs it watched for normal_seconds (a stop there is a false stop).
# Then the fan is turned off, the card strip is fitted by hand (H2's protocol: never with the
# blades turning), and 'fan on' starts the fault. Timed from that command, so the 5 s hold-off
# and the kick-start are inside the time. The card is removed again before the next trial.
# The model, the limits rule, the light and the 5 s hold-off are H3's and H6's; nothing is
# tuned here.
phase: H7
final: true  # a live measurement of the final model, logged once; nothing is chosen from it

model_config: configs/h3_gmm.yaml  # exported with --seed 0 (andon.export_gmm) and flashed
seed: 0
model:
  type: gmm

data:
  recording_config: configs/h2_recording.yaml  # the fault, its duty and the settle time

calib_timeout_seconds: 720  # only if the board has no limits for the fan yet
wait_minutes: 30            # for the button and for fitting the fault

series:
  fault: obstruction
  start: fit_each
  trials: 10                # PLAN.md, H7
  normal_seconds: 30      # watched normal running before the fault (not for fit_once)
  stop_timeout_seconds: 60  # H6's slowest stop was 11.661 s (id_00)
